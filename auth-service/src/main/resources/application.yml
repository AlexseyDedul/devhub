server:
  port: ${SERVER_PORT:8080}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: password
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

keycloak:
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:default}
  token-uri: ${KEYCLOAK_TOKEN_URI}
  userinfo-uri: ${KEYCLOAK_USERINFO_URI}
  admin-user-create-uri: ${KEYCLOAK_ADMIN_CREATE_URI}
  roles-uri: ${KEYCLOAK_ROLES_URI}
  roles-mapping-uri: ${KEYCLOAK_ROLE_MAPPING_URI}
  admin-login: ${KEYCLOAK_ADMIN_LOGIN}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  security:
    enabled: false
