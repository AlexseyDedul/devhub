apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50401
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: client-secret
            - name: KEYCLOAK_ADMIN_LOGIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-login
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 50401
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 50401
            initialDelaySeconds: 30
            periodSeconds: 10
